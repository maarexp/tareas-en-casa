services:
  en-casa:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_SECRET: ${APP_SECRET:?Genera APP_SECRET y guardalo en el archivo .env}
      DATA_FILE: /data/hogar.json
      PERSISTENT_STORAGE: "1"
    volumes:
      - hogar-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  hogar-data:
