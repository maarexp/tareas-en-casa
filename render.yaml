services:
  - type: web
    name: en-casa-edu-minerva
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: REQUIRE_POSTGRES
        value: "1"
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
